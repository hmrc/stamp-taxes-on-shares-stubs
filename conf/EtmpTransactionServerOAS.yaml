                  $ref: "#/components/examples/sample-stc-transactions-view-response-flat-200"
        "400":
          description: "Bad Request"
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid-type"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    description: "SAP PI System Error Response"
                    type: "object"
