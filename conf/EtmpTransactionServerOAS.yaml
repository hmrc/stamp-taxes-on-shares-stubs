openapi: "3.0.1"
info:
  title: "STC Transaction"
  description: "This API specification describes the data structures and operations\
    \ to interact with a tax payer's STC Transaction .\n \nThere are at present the\
    \ following operations: \n\n1. Create the taxpayer's STC Transaction details.\n\
    2. Update the taxpayer's STC Transaction details.\n3. Retrieve the taxpayer's\
    \ STC Transaction details.\n\n**EPID references:** \n\n- EPID1682- HIP OAS:STC\
    \ Transaction .\n\n\n```\nChange Log\n```\n| Version | Date | Author | Description\
    \ |\n|---|-----|------|-----|\n|0.1.0 | 09-03-2026 |Arati Pradhan| Initial draft.\
    \ |\n|0.2.0 | 16-03-2026 |Arati Pradhan| Updated internal review comment. |\n"
  version: "0.2.0"
  termsOfService: "http://INSERT_LINK_TO_SLA_HERE"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0"
  x-integration-catalogue:
    api-type: "SIMPLE"
    backends:
      - "ETMP"
    domain: "2.0"
    platform: "HIP"
    publisher-reference: "EPID 1630 -STC Subscription API"
    reviewed-date: "2025-10-10T18:28:00Z"
    short-description: "STC Subscription API "
    status: "BETA"
    sub-domain: "2.26"
servers:
  - url: "http://etmp-egress-gateway.egress.svc.cluster.local"
    description: "Egress Gateway to ETMP TEST"
tags:
  - name: "STC Transaction"
    description: "Securities Transfer Charge : Transaction"
paths:
  /RESTAdapter/stc/transaction/{stcId}:
    parameters:
      - name: "stcId"
        in: "path"
        description: "STC Reference ID"
        required: true
        deprecated: false
        allowEmptyValue: false
        style: "simple"
        schema:
          type: "string"
          minLength: 1
          maxLength: 15
        example: "XASTC0000123456"
    post:
      deprecated: false
      summary: "Consumer to ETMP STC Transaction Create Operation"
      description: "This operation allows taxpayer to create STC Transaction details\
        \ on ETMP-SAFE. \n\nThe call is synchronous.\n\nIf successful, the API will\
        \ return the processing date/time and charges associated utrn for STC transactions.\n\
        \nIf unsuccessful, the API will return the processing date/time ,error code\
        \ and text.\n\n**EPID reference:** \n- EPID1684 - STC Transaction Create API"
      operationId: "STCTransactionCreate"
      tags:
        - "STC Transaction"
      parameters:
        - name: "correlationid"
          in: "header"
          description: "Unique alphanumeric ID for traceability and debugging.\nMust\
          \ be generated by the originating system.\nMust conform to 36-character\
          \ UUID format."
          required: true
          deprecated: false
          allowEmptyValue: false
          style: "simple"
          schema:
            pattern: "^[0-9a-fA-F]{8}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{12}$"
            type: "string"
          example: "f0bd1f32-de51-45cc-9b18-0520d6e3ab1a"
        - name: "X-Originating-System"
          in: "header"
          description: "System that is the originator of the message. This should be\
          \ the consumer of the API Example \"STC\""
          required: true
          deprecated: false
          allowEmptyValue: false
          style: "simple"
          schema:
            maxLength: 30
            minLength: 1
            type: "string"
          example: "MDTP-STC"
        - name: "X-Receipt-Date"
          in: "header"
          description: "The time the message was created by the system sending the message.\
          \ The value should follow this date-time pattern, and be represented in\
          \ the UTC time zone: yyyy-MM-ddTHH:mm:ssZ"
          required: true
          deprecated: false
          allowEmptyValue: false
          style: "simple"
          schema:
            format: "date-time"
            type: "string"
          example: "2025-01-30T23:59:59Z"
        - name: "X-Transmitting-System"
          in: "header"
          description: "Intermediary system that performs the transmission of the message.\n"
          required: true
          deprecated: false
          allowEmptyValue: false
          style: "simple"
          schema:
            enum:
              - "HIP"
            type: "string"
          example: "HIP"
      requestBody:
        description: "Request structure"
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/schema-stc-transactions-create-request-flat"
            examples:
              sample-stc-transactions-create-request:
                $ref: "#/components/examples/sample-stc-transactions-create-request-flat"
      responses:
        "201":
          description: "ETMP has successfully accepted the registation data and will\
            \ process the registration further."
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid-type"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/schema-stc-transactions-create-response-201"
              examples:
                sample-stc-subscription-create-response-success-201:
                  $ref: "#/components/examples/sample-stc-transactions-create-response-flat-201"
        "400":
          description: "Bad Request"
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid-type"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    description: "SAP PI System Error Response"
                    type: "object"
                    properties:
                      code:
                        description: "If HTTP400, then code value will be 400."
                        type: "string"
                        enum:
                          - "400"
                      message:
                        type: "string"
                        minLength: 1
                        maxLength: 5000
                      logID:
                        type: "string"
                        minLength: 32
                        maxLength: 32
                        pattern: "^[A-F0-9]{32}$"
                    required:
                      - "code"
                      - "message"
                      - "logID"
                    additionalProperties: false
                required:
                  - "error"
                additionalProperties: false
        "401":
          description: "Unauthorized"
        "403":
          description: "Forbidden"
        "404":
          description: "Not Found"
        "422":
          description: "ETMP validation errors. \nErrors of this kind indicate that\
            \ ETMP successfully received the data without any technical issues, however\
            \ it is unable to process the data further for the reason given by the\
            \ code and text.\n\n```\n[ code | text]\n002 |STC\_ID does not exist\_\
            \n136 |Duplicate\_transaction\_\n037 |Agent Name blank\n037 |Contingent\
            \ details invalid\n037 |Deferment Extension Details Invalid\n037 |Main\
            \ Seller Details Invalid\n037 |Other\_Seller Details Invalid\n037 |Main\
            \ Buyer Details Invalid\n037 |Other\_Buyer Details invalid\n037 |Agent\_\
            Details Invalid\n037 |Declaration\_Details invalid\n038 |Transaction Limit\
            \ Exceeded\_\n"
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid-type"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/schema-stc-transactions-create-response-422"
              examples:
                schema-stc-transactions-create-response-422:
                  $ref: "#/components/examples/sample-stc-transaction-create-response-error-422"
        "500":
          description: "Internal Server Error"
          headers:
            correlationid:
              $ref: "#/components/headers/correlationid-type"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    description: "SAP PI System Error Response"
                    type: "object"
                    properties:
                      code:
                        description: "If HTTP500, then code value will be 500."
                        type: "string"
                        enum:
                          - "500"
                      message:
                        type: "string"
                        minLength: 1
                        maxLength: 5000
                      logID:
                        type: "string"
                        minLength: 32
                        maxLength: 32
                        pattern: "^[A-F0-9]{32}$"
                    required:
                      - "code"
                      - "message"
                      - "logID"
                    additionalProperties: false
                required:
                  - "error"
                additionalProperties: false
  /RESTAdapter/stc/transaction/{stcId}/{utrn}:
