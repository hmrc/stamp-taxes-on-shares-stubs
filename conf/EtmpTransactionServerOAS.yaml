components:
  headers:
    correlationid-type:
      description: "Unique alphanumeric number used for correlation purposes, generated\
        \ by the originating system and conforming to 36-character UUID (formatted)."
      style: "simple"
      required: false
      deprecated: false
      schema:
        pattern: "^[0-9a-fA-F]{8}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{4}[-][0-9a-fA-F]{12}$"
        type: "string"
      example: "f0bd1f32-de51-45cc-9b18-0520d6e3ab1a"
  schemas:
    actual-date-type:
      type: "string"
      format: "date"
    agent-addr1-type:
      type: "string"
      minLength: 1
      maxLength: 100
    agent-addr2-type:
      type: "string"
      minLength: 1
      maxLength: 40
    agent-addr3-type:
      type: "string"
      minLength: 1
      maxLength: 40
    agent-addr4-type:
      type: "string"
      minLength: 1
      maxLength: 40
    agent-client-reference-type:
      type: "string"
      minLength: 1
      maxLength: 255
    agent-country-type:
      type: "string"
      minLength: 1
      maxLength: 100
    agent-details-amend-type:
      type: "object"
      properties:
        clientReference:
          $ref: "#/components/schemas/agent-client-reference-type"
      required:
        - "clientReference"
      additionalProperties: false
    agent-details-create-type:
